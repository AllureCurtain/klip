[package]
name = "klip"
version = "0.3.0"
description = "A Windows-first local clipboard manager"
authors = ["Klip Team"]
edition = "2021"
# `src/bin/klip_http_check.rs` is a second binary target, so bare `cargo run`
# (used by `tauri dev`) is ambiguous without this.
default-run = "klip"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Gates the `klip_http_check` helper binary. It serves the full production HTTP
# router against any data directory it is pointed at, and the router's bearer
# gate is disabled by default (empty `http_access_token`), so shipping it would
# hand every local process an unauthenticated read of the user's clipboard
# history. Kept out of release bundles; enable explicitly for local debugging.
http-check-bin = []

# Auto-discovery would build `src/bin/klip_http_check.rs` in every release, and
# the Windows bundlers copy whatever executables land in the output directory.
[[bin]]
name = "klip_http_check"
path = "src/bin/klip_http_check.rs"
required-features = ["http-check-bin"]

[[bin]]
name = "klip"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
# Single clipboard library for every platform and every content type.
# The `wayland` feature keeps Linux parity with the previous wl-copy path;
# without it clipboard-rs is X11-only. See src/clipboard/backend.rs.
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
url = "2"
image = "0.25"
fast_image_resize = "3"
base64 = "0.22"
enigo = "0.3"
tauri-plugin-dialog = "2"
csv = "1.3"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tantivy = "=0.24.2"
# 0.16 is the release compatible with Tantivy 0.24's tokenizer API 0.5.
tantivy-jieba = "=0.16.0"
# Pin the OCR API and ONNX Runtime integration used by the bundled PP-OCRv5 models.
oar-ocr = "=0.6.2"
# oar-ocr 0.6.2 declares caret ranges; newer 0.6.x core / ORT rc releases are
# source-incompatible. Direct constraints keep Cargo updates on the tested pair.
oar-ocr-core = { version = "=0.6.2", default-features = false }
ort = { version = "=2.0.0-rc.12", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"
x11rb = { version = "0.13", default-features = false }
# Same ONNX Runtime integration as Windows: load the bundled
# libonnxruntime.so dynamically (resources/onnxruntime/linux-x86_64, see
# src/ocr/mod.rs). `api-24` pins the generated bindings to ORT 1.24's API
# table (matching the bundled 1.24.2); `load-dynamic` is the only strategy
# that can obtain the runtime on Linux without a system package.
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "api-24",
    "load-dynamic",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "libc",
    "NSRunningApplication",
    "NSWorkspace",
    "std",
] }

[target.'cfg(windows)'.dependencies]
# The official static ONNX Runtime 1.24.2 build requires a newer MSVC STL than
# our supported toolchain. Load the bundled runtime DLL explicitly on Windows.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "load-dynamic"] }
windows = { version = "0.59", features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
