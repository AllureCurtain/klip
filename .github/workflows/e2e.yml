name: Desktop E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  windows-e2e:
    name: Windows desktop E2E
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      - name: Install EdgeDriver matching WebView2
        shell: pwsh
        run: ./scripts/install-matching-edgedriver.ps1 -AddToGitHubPath
      - run: pnpm e2e
