name: Desktop E2E

# Manual trigger only. The desktop E2E suite drives a real Tauri window and the
# Windows clipboard through WebDriver, which is inherently flaky on hosted
# runners (DIB image timing, focus/paste races). A nightly schedule turned that
# flakiness into daily failure mail without ever gating a change, so the suite
# is now run on demand — before a release, or when touching clipboard/paste code.
on:
  workflow_dispatch:

jobs:
  windows-e2e:
    name: Windows desktop E2E
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      - name: Install EdgeDriver matching WebView2
        shell: pwsh
        run: ./scripts/install-matching-edgedriver.ps1 -AddToGitHubPath
      - run: pnpm e2e
