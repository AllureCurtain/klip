name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.1
        required: true
        type: string
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: write

jobs:
  windows:
    name: Windows installers
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile

      # Scoped to --prod: only production dependencies ship in the
      # installer. Dev-tooling advisories must not block a release.
      # Unlike CI, audits stay BEFORE the build here on purpose -- we
      # do not want to publish artifacts we have not audited.
      - run: pnpm audit --prod --registry=https://registry.npmjs.org --audit-level high

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Verify release prerequisites
        run: pnpm release:verify -SkipBundle

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Klip ${{ inputs.tag || github.ref_name }}
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: false

      - name: Package standalone ZIP and checksums
        shell: pwsh
        run: ./scripts/package-windows-zip.ps1

      - name: Upload standalone ZIP and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KLIP_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $archives = @(Get-ChildItem src-tauri/target/release/bundle/zip/*.zip | ForEach-Object FullName)
          gh release upload $env:KLIP_RELEASE_TAG @archives src-tauri/target/release/bundle/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release archives.' }
